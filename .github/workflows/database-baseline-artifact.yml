name: Database baseline verification

on:
  push:
    branches:
      - hardening/p0-database-baseline
      - hardening/p0-db-baseline-chain
  pull_request:
    branches:
      - hardening/integration
      - restore-checkpoint-c905836
      - main

jobs:
  verify-baseline:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: qxflow_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d qxflow_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/qxflow_ci
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/qxflow_ci
      JWT_SECRET: ci-only-secret-ci-only-secret-1234567890
      NEXT_PUBLIC_DEMO_MODE: "false"
      NEXT_PUBLIC_USE_REAL_API: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Verify migration chain shape
        run: |
          test -f prisma/migrations/0_baseline_production_20260811/migration.sql
          test -f prisma/migrations/20260811071500_reconcile_preanesthesia_phase2/migration.sql
          count=$(find prisma/migrations -mindepth 2 -maxdepth 2 -name migration.sql | wc -l)
          test "$count" -eq 2
          grep -q "PATIENT_WORKFLOW_STARTED" prisma/migrations/0_baseline_production_20260811/migration.sql
          if grep -q "preanesthesiaAppointmentAt" prisma/migrations/0_baseline_production_20260811/migration.sql; then
            echo "Production baseline must not contain the missing phase2 column"
            exit 1
          fi
          grep -q "PREANESTHESIA_NO_SLOT_AVAILABLE" prisma/migrations/20260811071500_reconcile_preanesthesia_phase2/migration.sql
          grep -q "ADD COLUMN IF NOT EXISTS \"preanesthesiaAppointmentAt\"" prisma/migrations/20260811071500_reconcile_preanesthesia_phase2/migration.sql

      - name: Apply baseline only to fresh PostgreSQL
        run: psql "$DIRECT_URL" -v ON_ERROR_STOP=1 -f prisma/migrations/0_baseline_production_20260811/migration.sql

      - name: Assert baseline matches observed production gaps
        run: |
          psql "$DIRECT_URL" -v ON_ERROR_STOP=1 -Atc "SELECT NOT EXISTS (SELECT 1 FROM information_schema.columns WHERE table_schema='public' AND table_name='PatientInBlock' AND column_name='preanesthesiaAppointmentAt');" | grep -qx t
          psql "$DIRECT_URL" -v ON_ERROR_STOP=1 -Atc "SELECT NOT EXISTS (SELECT 1 FROM information_schema.columns WHERE table_schema='public' AND table_name='PatientInBlock' AND column_name='isDeferredUrgency');" | grep -qx t
          psql "$DIRECT_URL" -v ON_ERROR_STOP=1 -Atc "SELECT NOT EXISTS (SELECT 1 FROM information_schema.columns WHERE table_schema='public' AND table_name='PatientInBlock' AND column_name='specialCircuitReason');" | grep -qx t
          psql "$DIRECT_URL" -v ON_ERROR_STOP=1 -Atc "SELECT COUNT(*) FROM pg_enum e JOIN pg_type t ON t.oid=e.enumtypid WHERE t.typname='ReservationEventType';" | grep -qx 11

      - name: Reset CI database before Prisma migration-chain test
        run: |
          psql "$DIRECT_URL" -v ON_ERROR_STOP=1 -c 'DROP SCHEMA public CASCADE; CREATE SCHEMA public;'

      - name: Apply full migration chain to fresh PostgreSQL
        run: npx prisma migrate deploy

      - name: Verify migration status
        run: npx prisma migrate status

      - name: Verify database matches Prisma schema after reconciliation
        run: npx prisma migrate diff --from-schema-datasource prisma/schema.prisma --to-schema-datamodel prisma/schema.prisma --exit-code

      - name: Assert phase2 reconciliation objects exist
        run: |
          psql "$DIRECT_URL" -v ON_ERROR_STOP=1 -Atc "SELECT EXISTS (SELECT 1 FROM information_schema.columns WHERE table_schema='public' AND table_name='PatientInBlock' AND column_name='preanesthesiaAppointmentAt');" | grep -qx t
          psql "$DIRECT_URL" -v ON_ERROR_STOP=1 -Atc "SELECT EXISTS (SELECT 1 FROM information_schema.columns WHERE table_schema='public' AND table_name='PatientInBlock' AND column_name='isDeferredUrgency');" | grep -qx t
          psql "$DIRECT_URL" -v ON_ERROR_STOP=1 -Atc "SELECT EXISTS (SELECT 1 FROM information_schema.columns WHERE table_schema='public' AND table_name='PatientInBlock' AND column_name='specialCircuitReason');" | grep -qx t
          psql "$DIRECT_URL" -v ON_ERROR_STOP=1 -Atc "SELECT COUNT(*) FROM pg_enum e JOIN pg_type t ON t.oid=e.enumtypid WHERE t.typname='ReservationEventType';" | grep -qx 19

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Verify guarded db push is blocked in CI
        run: |
          if npm run db:push; then
            echo "db:push unexpectedly succeeded in CI"
            exit 1
          fi
          echo "db:push correctly blocked"

      - name: P0 regression tests
        run: npm test

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
