name: Database baseline verification

on:
  push:
    branches:
      - hardening/p0-database-baseline
  pull_request:
    branches:
      - hardening/integration
      - restore-checkpoint-c905836
      - main

jobs:
  verify-baseline:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: qxflow_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d qxflow_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/qxflow_ci
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/qxflow_ci
      JWT_SECRET: ci-only-secret-ci-only-secret-1234567890
      NEXT_PUBLIC_DEMO_MODE: "false"
      NEXT_PUBLIC_USE_REAL_API: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate current-schema baseline artifact
        run: |
          mkdir -p baseline-artifact
          npx prisma migrate diff --from-empty --to-schema-datamodel prisma/schema.prisma --script --output baseline-artifact/generated-from-schema.sql
          test -s baseline-artifact/generated-from-schema.sql
          grep -q 'CREATE TABLE "User"' baseline-artifact/generated-from-schema.sql
          grep -q 'CREATE TABLE "Reservation"' baseline-artifact/generated-from-schema.sql
          grep -q 'CREATE TABLE "PatientInBlock"' baseline-artifact/generated-from-schema.sql
          grep -q 'CREATE TABLE "UserAuditEvent"' baseline-artifact/generated-from-schema.sql

      - name: Verify active migration chain contains only baseline
        run: |
          test -f prisma/migrations/0_baseline_current/migration.sql
          count=$(find prisma/migrations -mindepth 2 -maxdepth 2 -name migration.sql | wc -l)
          test "$count" -eq 1

      - name: Apply migration chain to fresh PostgreSQL
        run: npx prisma migrate deploy

      - name: Verify migration status
        run: npx prisma migrate status

      - name: Verify database matches Prisma schema after deploy
        run: npx prisma migrate diff --from-schema-datasource prisma/schema.prisma --to-schema-datamodel prisma/schema.prisma --exit-code

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Verify guarded db push is blocked in CI
        run: |
          if npm run db:push; then
            echo "db:push unexpectedly succeeded in CI"
            exit 1
          fi
          echo "db:push correctly blocked"

      - name: P0 regression tests
        run: npm test

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Upload generated baseline for review
        uses: actions/upload-artifact@v4
        with:
          name: prisma-baseline-review
          path: baseline-artifact/generated-from-schema.sql
          if-no-files-found: error
