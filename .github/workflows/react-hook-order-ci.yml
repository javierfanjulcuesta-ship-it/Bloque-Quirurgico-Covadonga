name: React hook hardening CI

on:
  push:
    branches:
      - hardening/p1-react-hook-order
  pull_request:
    branches:
      - hardening/integration

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://unused:unused@127.0.0.1:5432/unused
      DIRECT_URL: postgresql://unused:unused@127.0.0.1:5432/unused
      JWT_SECRET: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-ci-only
      NEXT_PUBLIC_DEMO_MODE: "false"
      NEXT_PUBLIC_USE_REAL_API: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx eslint src/components/calendar/WeekGridCalendar.tsx
      - run: npx tsc --noEmit
      - run: npm run build
