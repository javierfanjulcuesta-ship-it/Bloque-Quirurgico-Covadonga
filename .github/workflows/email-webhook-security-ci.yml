name: Email webhook security CI

on:
  push:
    branches:
      - hardening/p1-email-webhook-security
  pull_request:
    branches:
      - hardening/integration

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: qxflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d qxflow_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/qxflow_test?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/qxflow_test?schema=public
      JWT_SECRET: ci-only-jwt-secret-at-least-32-characters
      NEXT_PUBLIC_APP_URL: https://example.test
      EMAIL_WEBHOOK_SECRET: ci-email-webhook-secret-0123456789abcdef
      CRON_SECRET: ci-cron-secret-0123456789abcdef012345
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma validate
      - run: npx prisma migrate deploy
      - run: npx prisma generate
      - run: npm test
      - run: npm run test:booking-integration
      - run: npm run test:preanesthesia-integration
      - run: npm run test:cron-integration
      - run: npm run test:assignments-integration
      - run: npm run test:shared-state-integration
      - run: npx tsc --noEmit
      - run: npm run build
      - name: "Lint informational - pre-existing debt tracked separately"
        continue-on-error: true
        run: npm run lint
